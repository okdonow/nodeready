<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动漫风格网页</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #ff7e5f, #feb47b); /* 漸變背景 */
            color: #fff;
        }

        h1 {
            text-align: center;
            font-family: 'Comic Sans MS', sans-serif;
            font-size: 3em;
            margin-top: 50px;
            color: #fff;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5); /* 动漫感的阴影效果 */
        }

        .content {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .content p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #ff6f61;
            color: white;
            font-size: 1.2em;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #d9574b; /* 按钮悬停效果 */
        }
    </style>
</head>
<body>

    <h1>欢迎来到我的动漫世界！</h1>

    <div class="content">
        <p>这是一个简单的动漫风格网页，展示了基本的文本内容。你可以根据自己的需要添加更多的内容，或者设计一个更复杂的页面。</p>
        <a href="#" class="btn">点击我！</a>
    </div>

</body>
</html>
